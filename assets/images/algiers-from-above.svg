<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="skyGrad1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c3e50"/>
      <stop offset="45%" stop-color="#4a6984"/>
      <stop offset="70%" stop-color="#d4af94"/>
      <stop offset="90%" stop-color="#f8b195"/>
      <stop offset="100%" stop-color="#f67280"/>
    </linearGradient>
    <linearGradient id="seaGrad1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#24495e"/>
      <stop offset="40%" stop-color="#1b3644"/>
      <stop offset="100%" stop-color="#0e1f28"/>
    </linearGradient>
    <linearGradient id="hillGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3d5a5b"/>
      <stop offset="100%" stop-color="#1f2d3a"/>
    </linearGradient>
    <radialGradient id="sunGlow1" cx="65%" cy="60%" r="40%">
      <stop offset="0%" stop-color="#fff5e6" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#f8b195" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f67280" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="1600" height="900" fill="url(#skyGrad1)"/>

  <!-- Sun Glow -->
  <circle cx="1050" cy="460" r="300" fill="url(#sunGlow1)" filter="url(#blur1)"/>
  <circle cx="1050" cy="460" r="50" fill="#ffffff" opacity="0.85"/>

  <!-- Distant Mediterranean Sea & Bay of Algiers -->
  <path d="M 0,510 Q 400,500 800,520 T 1600,510 L 1600,900 L 0,900 Z" fill="url(#seaGrad1)"/>

  <!-- Distant Coastal Mountain Ridges (Atlas range) -->
  <path d="M 0,510 Q 250,440 500,480 T 1000,470 T 1400,430 T 1600,470 L 1600,530 L 0,530 Z" fill="url(#hillGrad1)" opacity="0.6"/>
  <path d="M 0,520 Q 350,470 700,500 T 1300,460 T 1600,490 L 1600,540 L 0,540 Z" fill="#203342" opacity="0.8"/>

  <!-- Sea Highlights -->
  <ellipse cx="1050" cy="540" rx="200" ry="12" fill="#ffd1b3" opacity="0.35"/>
  <ellipse cx="1050" cy="570" rx="350" ry="15" fill="#f8b195" opacity="0.25"/>
  <ellipse cx="1050" cy="620" rx="450" ry="18" fill="#ffd1b3" opacity="0.18"/>

  <!-- Coastal White City Terraces & Historic Architecture (Casbah & Modern Bay) -->
  <!-- Layer 1: Distant City Blocks -->
  <g fill="#d8e1e8" opacity="0.85">
    <rect x="150" y="580" width="80" height="40" rx="1"/>
    <rect x="220" y="560" width="95" height="60" rx="1"/>
    <rect x="300" y="575" width="110" height="45" rx="1"/>
    <rect x="400" y="550" width="130" height="70" rx="1"/>
    <rect x="520" y="570" width="90" height="50" rx="1"/>
    <rect x="600" y="585" width="140" height="40" rx="1"/>
  </g>

  <!-- Layer 2: Midground Urban Terraces -->
  <g fill="#f1f5f9">
    <rect x="80" y="610" width="140" height="85" rx="2"/>
    <rect x="210" y="590" width="160" height="110" rx="2"/>
    <rect x="360" y="605" width="180" height="95" rx="2"/>
    <rect x="530" y="595" width="150" height="110" rx="2"/>
    <rect x="670" y="620" width="170" height="80" rx="2"/>
  </g>

  <!-- Architectural Windows & Details -->
  <g fill="#1e293b" opacity="0.6">
    <rect x="100" y="630" width="12" height="18" rx="1"/>
    <rect x="130" y="630" width="12" height="18" rx="1"/>
    <rect x="160" y="630" width="12" height="18" rx="1"/>
    <rect x="235" y="615" width="14" height="22" rx="1"/>
    <rect x="270" y="615" width="14" height="22" rx="1"/>
    <rect x="305" y="615" width="14" height="22" rx="1"/>
    <rect x="390" y="625" width="16" height="24" rx="1"/>
    <rect x="430" y="625" width="16" height="24" rx="1"/>
    <rect x="470" y="625" width="16" height="24" rx="1"/>
  </g>

  <!-- Foreground Promontory & Palm Trees -->
  <path d="M 0,690 Q 300,660 700,720 T 1600,740 L 1600,900 L 0,900 Z" fill="#15212b"/>

  <!-- Foreground Boulevard & Coastal Promenade -->
  <path d="M 0,770 Q 400,740 900,780 T 1600,810 L 1600,900 L 0,900 Z" fill="#0d151c"/>

  <!-- Mediterranean Cypress & Palm Trees Silhouettes -->
  <g fill="#0b1117">
    <!-- Palm 1 -->
    <path d="M 120,780 Q 140,730 160,670 Q 140,665 110,675 M 160,670 Q 180,650 220,660 M 160,670 Q 190,685 205,715 M 160,670 Q 145,695 130,710 M 160,670 Q 130,650 120,640" stroke="#0b1117" stroke-width="4" fill="none"/>
    <!-- Palm 2 -->
    <path d="M 280,790 Q 295,720 310,650 Q 280,640 250,655 M 310,650 Q 340,630 380,645 M 310,650 Q 345,670 360,705 M 310,650 Q 290,680 270,700 M 310,650 Q 275,625 260,610" stroke="#0b1117" stroke-width="4" fill="none"/>
    <!-- Slender Cypress -->
    <path d="M 750,780 Q 755,680 760,640 Q 765,680 770,780 Z"/>
    <path d="M 790,790 Q 794,700 798,660 Q 802,700 806,790 Z"/>
  </g>

  <!-- Warm Atmospheric Light Overlay -->
  <rect width="1600" height="900" fill="#ffaa5e" opacity="0.08" style="mix-blend-mode: overlay;"/>
</svg>
