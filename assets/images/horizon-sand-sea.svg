<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <!-- Soft Ethereal Sky Gradient matching reference screenshot -->
    <linearGradient id="skyRef" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b6cde2"/>
      <stop offset="35%" stop-color="#cfdce8"/>
      <stop offset="65%" stop-color="#e3eaf2"/>
      <stop offset="90%" stop-color="#f0f3f6"/>
      <stop offset="100%" stop-color="#e2e8ee"/>
    </linearGradient>

    <!-- Tidal Wet Sand Mirror Reflection Gradient -->
    <linearGradient id="sandMirror" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d6dde5"/>
      <stop offset="20%" stop-color="#cbd5e0"/>
      <stop offset="50%" stop-color="#c4ceda"/>
      <stop offset="80%" stop-color="#bcc7d4"/>
      <stop offset="100%" stop-color="#b5c1cf"/>
    </linearGradient>

    <!-- Soft Cloud Blurring -->
    <filter id="cloudBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="1600" height="490" fill="url(#skyRef)"/>

  <!-- Cumulus Clouds -->
  <g fill="#ffffff" filter="url(#cloudBlur)" opacity="0.85">
    <ellipse cx="280" cy="240" rx="140" ry="50"/>
    <ellipse cx="360" cy="220" rx="100" ry="45"/>
    <ellipse cx="220" cy="250" rx="90" ry="40"/>
    
    <ellipse cx="780" cy="260" rx="160" ry="55"/>
    <ellipse cx="880" cy="235" rx="120" ry="45"/>
    <ellipse cx="700" cy="270" rx="100" ry="38"/>

    <ellipse cx="1320" cy="280" rx="150" ry="50"/>
    <ellipse cx="1400" cy="255" rx="110" ry="42"/>
  </g>

  <!-- Horizon Line -->
  <line x1="0" y1="490" x2="1600" y2="490" stroke="#aab7c4" stroke-width="1.5"/>

  <!-- Tidal Sand Mirror -->
  <rect y="490" width="1600" height="410" fill="url(#sandMirror)"/>

  <!-- Inverted Cloud Reflections in Wet Sand Water -->
  <g fill="#ffffff" filter="url(#cloudBlur)" opacity="0.35">
    <ellipse cx="280" cy="650" rx="140" ry="45"/>
    <ellipse cx="360" cy="670" rx="100" ry="40"/>
    <ellipse cx="780" cy="640" rx="150" ry="50"/>
  </g>

  <!-- Group 1: Carriage & Horses Left (similar to reference image) -->
  <g id="carriage1">
    <!-- Reflection -->
    <g opacity="0.25" transform="matrix(1 0 0 -0.6 0 850)">
      <rect x="240" y="440" width="68" height="34" rx="4" fill="#a46820"/>
      <circle cx="252" cy="474" r="10" fill="#2b2622"/>
      <circle cx="296" cy="474" r="10" fill="#2b2622"/>
      <ellipse cx="210" cy="455" rx="20" ry="10" fill="#382516"/>
      <ellipse cx="170" cy="455" rx="20" ry="10" fill="#382516"/>
    </g>
    <!-- Actual Carriage & Horses -->
    <g>
      <!-- Carriage Body (Yellow/Orange ochre like reference) -->
      <rect x="240" y="442" width="68" height="30" rx="4" fill="#cf7f28"/>
      <!-- People on Carriage -->
      <circle cx="255" cy="436" r="4.5" fill="#374151"/>
      <circle cx="267" cy="435" r="4.5" fill="#4b5563"/>
      <circle cx="279" cy="436" r="4.5" fill="#1f2937"/>
      <circle cx="291" cy="435" r="4.5" fill="#374151"/>
      <!-- Wheels -->
      <circle cx="252" cy="474" r="9" fill="#1f2937"/>
      <circle cx="296" cy="474" r="9" fill="#1f2937"/>
      <!-- Wagon Shaft -->
      <line x1="240" y1="462" x2="160" y2="462" stroke="#4b5563" stroke-width="2"/>
      <!-- Horse 2 -->
      <ellipse cx="205" cy="457" rx="18" ry="9" fill="#4d2f16"/>
      <ellipse cx="192" cy="448" rx="7" ry="10" fill="#4d2f16" transform="rotate(-25 192 448)"/>
      <line x1="195" y1="465" x2="193" y2="477" stroke="#4d2f16" stroke-width="3"/>
      <line x1="215" y1="465" x2="217" y2="477" stroke="#4d2f16" stroke-width="3"/>
      <!-- Horse 1 -->
      <ellipse cx="165" cy="457" rx="18" ry="9" fill="#5c381b"/>
      <ellipse cx="152" cy="448" rx="7" ry="10" fill="#5c381b" transform="rotate(-25 152 448)"/>
      <line x1="155" y1="465" x2="153" y2="477" stroke="#5c381b" stroke-width="3"/>
      <line x1="175" y1="465" x2="177" y2="477" stroke="#5c381b" stroke-width="3"/>
    </g>
  </g>

  <!-- Group 2: Center Carriage & Horses -->
  <g id="carriage2" transform="translate(260, 0)">
    <!-- Reflection -->
    <g opacity="0.25" transform="matrix(1 0 0 -0.6 0 850)">
      <rect x="240" y="440" width="68" height="34" rx="4" fill="#a46820"/>
      <circle cx="252" cy="474" r="10" fill="#2b2622"/>
      <circle cx="296" cy="474" r="10" fill="#2b2622"/>
      <ellipse cx="210" cy="455" rx="20" ry="10" fill="#382516"/>
    </g>
    <!-- Actual Carriage & Horses -->
    <g>
      <rect x="240" y="442" width="68" height="30" rx="4" fill="#cf7f28"/>
      <circle cx="255" cy="436" r="4.5" fill="#374151"/>
      <circle cx="267" cy="435" r="4.5" fill="#1f2937"/>
      <circle cx="279" cy="436" r="4.5" fill="#4b5563"/>
      <circle cx="291" cy="435" r="4.5" fill="#374151"/>
      <circle cx="252" cy="474" r="9" fill="#1f2937"/>
      <circle cx="296" cy="474" r="9" fill="#1f2937"/>
      <line x1="240" y1="462" x2="160" y2="462" stroke="#4b5563" stroke-width="2"/>
      <ellipse cx="205" cy="457" rx="18" ry="9" fill="#4d2f16"/>
      <ellipse cx="192" cy="448" rx="7" ry="10" fill="#4d2f16" transform="rotate(-25 192 448)"/>
      <line x1="195" y1="465" x2="193" y2="477" stroke="#4d2f16" stroke-width="3"/>
      <line x1="215" y1="465" x2="217" y2="477" stroke="#4d2f16" stroke-width="3"/>
      <ellipse cx="165" cy="457" rx="18" ry="9" fill="#5c381b"/>
      <ellipse cx="152" cy="448" rx="7" ry="10" fill="#5c381b" transform="rotate(-25 152 448)"/>
      <line x1="155" y1="465" x2="153" y2="477" stroke="#5c381b" stroke-width="3"/>
      <line x1="175" y1="465" x2="177" y2="477" stroke="#5c381b" stroke-width="3"/>
    </g>
  </g>

  <!-- Group 3: Right Carriage & Horses -->
  <g id="carriage3" transform="translate(560, 0)">
    <!-- Reflection -->
    <g opacity="0.25" transform="matrix(1 0 0 -0.6 0 850)">
      <rect x="240" y="440" width="68" height="34" rx="4" fill="#a46820"/>
      <circle cx="252" cy="474" r="10" fill="#2b2622"/>
      <circle cx="296" cy="474" r="10" fill="#2b2622"/>
    </g>
    <!-- Actual Carriage & Horses -->
    <g>
      <rect x="240" y="442" width="68" height="30" rx="4" fill="#cf7f28"/>
      <circle cx="255" cy="436" r="4.5" fill="#4b5563"/>
      <circle cx="267" cy="435" r="4.5" fill="#1f2937"/>
      <circle cx="279" cy="436" r="4.5" fill="#374151"/>
      <circle cx="252" cy="474" r="9" fill="#1f2937"/>
      <circle cx="296" cy="474" r="9" fill="#1f2937"/>
      <line x1="240" y1="462" x2="160" y2="462" stroke="#4b5563" stroke-width="2"/>
      <ellipse cx="205" cy="457" rx="18" ry="9" fill="#4d2f16"/>
      <ellipse cx="192" cy="448" rx="7" ry="10" fill="#4d2f16" transform="rotate(-25 192 448)"/>
      <line x1="195" y1="465" x2="193" y2="477" stroke="#4d2f16" stroke-width="3"/>
      <line x1="215" y1="465" x2="217" y2="477" stroke="#4d2f16" stroke-width="3"/>
      <ellipse cx="165" cy="457" rx="18" ry="9" fill="#5c381b"/>
      <ellipse cx="152" cy="448" rx="7" ry="10" fill="#5c381b" transform="rotate(-25 152 448)"/>
      <line x1="155" y1="465" x2="153" y2="477" stroke="#5c381b" stroke-width="3"/>
      <line x1="175" y1="465" x2="177" y2="477" stroke="#5c381b" stroke-width="3"/>
    </g>
  </g>

  <!-- Wet Sand Shimmer Water Ripples -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.3">
    <line x1="100" y1="520" x2="300" y2="520"/>
    <line x1="450" y1="560" x2="700" y2="560"/>
    <line x1="850" y1="530" x2="1150" y2="530"/>
    <line x1="1250" y1="580" x2="1500" y2="580"/>
  </g>
</svg>
