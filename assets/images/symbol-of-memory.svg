<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1500" width="1000" height="1500">
  <defs>
    <!-- Deep Architectural Sky Gradient -->
    <linearGradient id="monumentSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="40%" stop-color="#3b6998"/>
      <stop offset="75%" stop-color="#7ea6cb"/>
      <stop offset="100%" stop-color="#d4e2f0"/>
    </linearGradient>

    <!-- Monument Illuminated Concrete Facet -->
    <linearGradient id="facetLit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#e8ecf1"/>
      <stop offset="100%" stop-color="#c5d0dc"/>
    </linearGradient>

    <!-- Monument Shadow Concrete Facet -->
    <linearGradient id="facetShadow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Center Turret / Dome -->
    <linearGradient id="domeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <filter id="subtleAura">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="1000" height="1500" fill="url(#monumentSky)"/>

  <!-- Sun Glow around the Crown of the Monument -->
  <circle cx="500" cy="380" r="220" fill="#ffffff" opacity="0.35" filter="url(#subtleAura)"/>

  <!-- Esplanade Plaza Ground Floor -->
  <path d="M 0,1260 L 1000,1260 L 1000,1500 L 0,1500 Z" fill="#94a3b8"/>
  <path d="M 0,1320 L 1000,1320 L 1000,1500 L 0,1500 Z" fill="#64748b"/>

  <!-- Plaza Radial Paving Lines (Perspective to monument center) -->
  <g stroke="#cbd5e1" stroke-width="2" opacity="0.6">
    <line x1="500" y1="1260" x2="0" y2="1500"/>
    <line x1="500" y1="1260" x2="250" y2="1500"/>
    <line x1="500" y1="1260" x2="500" y2="1500"/>
    <line x1="500" y1="1260" x2="750" y2="1500"/>
    <line x1="500" y1="1260" x2="1000" y2="1500"/>
  </g>

  <!-- Soaring Architectural Monument (Iconic Three Curved Palm Fins - Maqam Echahid style) -->
  <!-- Left Fin -->
  <!-- Outer Lit Side -->
  <path d="M 120,1260 
           Q 220,950 360,650 
           Q 460,420 480,260 
           L 470,260 
           Q 410,480 300,750 
           Q 180,1020 80,1260 
           Z" 
        fill="url(#facetLit)"/>

  <!-- Left Fin Inner Shadow Side -->
  <path d="M 470,260 
           L 480,260 
           Q 470,440 390,700 
           Q 300,1000 240,1260 
           L 180,1260 
           Q 260,1000 370,700 
           Q 440,460 470,260 
           Z" 
        fill="url(#facetShadow)"/>

  <!-- Right Fin -->
  <!-- Outer Shadow Side -->
  <path d="M 880,1260 
           Q 780,950 640,650 
           Q 540,420 520,260 
           L 530,260 
           Q 590,480 700,750 
           Q 820,1020 920,1260 
           Z" 
        fill="url(#facetShadow)"/>

  <!-- Right Fin Inner Lit Side -->
  <path d="M 530,260 
           L 520,260 
           Q 530,440 610,700 
           Q 700,1000 760,1260 
           L 820,1260 
           Q 740,1000 630,700 
           Q 560,460 530,260 
           Z" 
        fill="url(#facetLit)"/>

  <!-- Central Soaring Fin (Rear Perspective) -->
  <path d="M 475,260 
           L 525,260 
           L 540,580 
           Q 535,850 515,1260 
           L 485,1260 
           Q 465,850 460,580 
           Z" 
        fill="#334155"/>

  <!-- Monument Central Turret / Eternal Flame Pavilion -->
  <g>
    <!-- Suspended Pavilion Ring -->
    <ellipse cx="500" cy="620" rx="90" ry="24" fill="url(#domeGrad)"/>
    <ellipse cx="500" cy="615" rx="84" ry="20" fill="#1e293b"/>
    <!-- Dome Base -->
    <path d="M 440,615 Q 500,530 560,615 Z" fill="url(#facetLit)"/>
    <!-- Eternal Flame Glow (Golden Ember in Center) -->
    <ellipse cx="500" cy="610" rx="15" ry="25" fill="#f59e0b"/>
    <ellipse cx="500" cy="605" rx="8" ry="16" fill="#fef08a"/>
  </g>

  <!-- Crown Spire / Apex Finial -->
  <polygon points="500,160 488,260 512,260" fill="url(#facetLit)"/>
  <line x1="500" y1="120" x2="500" y2="160" stroke="#ffffff" stroke-width="4"/>

  <!-- Silhouetted Visitors on Plaza for Dramatic Sense of Monumental Scale -->
  <g fill="#0f172a">
    <!-- Visitor Group Left -->
    <circle cx="340" cy="1320" r="5"/>
    <path d="M 336,1326 L 344,1326 L 343,1355 L 337,1355 Z"/>

    <circle cx="355" cy="1322" r="4.5"/>
    <path d="M 351,1327 L 359,1327 L 358,1353 L 352,1353 Z"/>

    <!-- Visitor Group Right -->
    <circle cx="670" cy="1325" r="5"/>
    <path d="M 666,1331 L 674,1331 L 673,1358 L 667,1358 Z"/>

    <circle cx="690" cy="1323" r="4.5"/>
    <path d="M 686,1328 L 694,1328 L 693,1356 L 687,1356 Z"/>
  </g>

  <!-- Birds Gliding High in Sky -->
  <g stroke="#ffffff" stroke-width="2" fill="none" opacity="0.6">
    <path d="M 280,350 Q 290,340 300,348 Q 310,340 320,350"/>
    <path d="M 340,380 Q 348,372 356,378 Q 364,372 372,380"/>
    <path d="M 720,410 Q 730,400 740,408 Q 750,400 760,410"/>
  </g>
</svg>
