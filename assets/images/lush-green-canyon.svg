<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1500" width="1000" height="1500">
  <defs>
    <!-- Canyon Sky through gorge gap -->
    <linearGradient id="canyonSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#99d6ea"/>
      <stop offset="60%" stop-color="#d1eff7"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Emerald Canyon Rock Left -->
    <linearGradient id="canyonLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#16382b"/>
      <stop offset="40%" stop-color="#214d3a"/>
      <stop offset="80%" stop-color="#2d6a50"/>
      <stop offset="100%" stop-color="#4e8c65"/>
    </linearGradient>

    <!-- Emerald Canyon Rock Right -->
    <linearGradient id="canyonRight" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#122e23"/>
      <stop offset="45%" stop-color="#1b4232"/>
      <stop offset="80%" stop-color="#2a6049"/>
      <stop offset="100%" stop-color="#3d7d5d"/>
    </linearGradient>

    <!-- Turquoise Canyon River -->
    <linearGradient id="canyonRiver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="30%" stop-color="#2dd4bf"/>
      <stop offset="60%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <filter id="sunRays" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25"/>
    </filter>
  </defs>

  <!-- Sky Slot -->
  <rect width="1000" height="1500" fill="url(#canyonSky)"/>

  <!-- Sun Rays Through Gorge -->
  <polygon points="500,0 420,0 300,1500 700,1500" fill="#ffffff" opacity="0.25" filter="url(#sunRays)"/>
  <polygon points="550,0 520,0 600,1500 850,1500" fill="#fef08a" opacity="0.18" filter="url(#sunRays)"/>

  <!-- Distant Waterfall in Gorge -->
  <rect x="495" y="450" width="10" height="300" fill="#ffffff" opacity="0.6"/>
  <ellipse cx="500" cy="750" rx="40" ry="15" fill="#ffffff" opacity="0.7" filter="url(#sunRays)"/>

  <!-- Left Canyon Wall -->
  <path d="M 0,0 
           L 380,0 
           Q 420,200 360,400 
           T 440,750 
           T 320,1100 
           T 380,1500 
           L 0,1500 Z" 
        fill="url(#canyonLeft)"/>

  <!-- Right Canyon Wall -->
  <path d="M 1000,0 
           L 620,0 
           Q 580,250 640,500 
           T 560,850 
           T 680,1200 
           T 620,1500 
           L 1000,1500 Z" 
        fill="url(#canyonRight)"/>

  <!-- Moss & Foliage Layers along Left Cliff -->
  <g fill="#34d399" opacity="0.6">
    <ellipse cx="360" cy="400" rx="35" ry="18"/>
    <ellipse cx="330" cy="420" rx="40" ry="20"/>
    <ellipse cx="420" cy="740" rx="50" ry="25"/>
    <ellipse cx="380" cy="770" rx="45" ry="22"/>
    <ellipse cx="310" cy="1080" rx="60" ry="30"/>
    <ellipse cx="280" cy="1120" rx="50" ry="25"/>
  </g>

  <!-- Moss & Foliage Layers along Right Cliff -->
  <g fill="#10b981" opacity="0.65">
    <ellipse cx="640" cy="510" rx="40" ry="20"/>
    <ellipse cx="670" cy="530" rx="45" ry="22"/>
    <ellipse cx="570" cy="860" rx="55" ry="25"/>
    <ellipse cx="610" cy="890" rx="50" ry="24"/>
    <ellipse cx="670" cy="1220" rx="60" ry="28"/>
  </g>

  <!-- Hanging Vines & Ferns -->
  <g stroke="#059669" stroke-width="3" fill="none" opacity="0.8">
    <path d="M 370,410 Q 360,480 365,550"/>
    <path d="M 385,420 Q 380,510 390,580"/>
    <path d="M 430,750 Q 420,840 435,920"/>
    <path d="M 630,520 Q 640,600 635,670"/>
    <path d="M 580,870 Q 590,960 585,1030"/>
  </g>

  <!-- Winding Rushing River Through Canyon Floor -->
  <path d="M 490,750 
           Q 520,850 460,950 
           T 540,1150 
           T 420,1350 
           L 600,1500 
           L 360,1500 
           Q 320,1350 420,1150 
           T 360,950 
           Z" 
        fill="url(#canyonRiver)"/>

  <!-- Rapids & River Foam -->
  <g stroke="#ffffff" stroke-width="3" fill="none" opacity="0.8">
    <path d="M 440,960 Q 470,950 500,970"/>
    <path d="M 410,1050 Q 450,1030 480,1060"/>
    <path d="M 460,1180 Q 510,1160 550,1190"/>
    <path d="M 390,1320 Q 440,1300 500,1330"/>
    <path d="M 420,1440 Q 480,1420 560,1450"/>
  </g>

  <!-- Water Mist Ambient at base -->
  <ellipse cx="500" cy="1400" rx="250" ry="80" fill="#ffffff" opacity="0.25" filter="url(#sunRays)"/>
</svg>
